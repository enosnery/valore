<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valore - Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
<main class="login-card">
    <h1>Valore</h1>
    <p class="muted">Acesse o sistema</p>
    <div class="alert error" th:if="${erro}" th:text="${erro}"></div>
    <form th:action="@{/login}" th:object="${loginForm}" method="post">
        <label for="login">Login</label>
        <input id="login" type="text" th:field="*{login}" autofocus>
        <small class="field-error" th:errors="*{login}"></small>
        <label for="senha">Senha</label>
        <input id="senha" type="password" th:field="*{senha}">
        <small class="field-error" th:errors="*{senha}"></small>
        <button class="button primary full-width" type="submit">Entrar</button>
    </form>
    <p class="hint">Ambiente inicial: admin / admin. Os demais acessos usam os usuários cadastrados.</p>
</main>
</body>
</html>
