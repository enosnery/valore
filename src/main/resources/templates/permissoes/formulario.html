<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valore - Permissões do usuário</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-valore">
    <div class="container">
        <a class="navbar-brand" href="/home">Valore</a>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button class="btn btn-link text-white text-decoration-none p-0" type="submit">Sair</button>
        </form>
    </div>
</nav>
<main class="container py-4" style="max-width:650px">
    <a class="back-link" href="/permissoes">← Permissões</a>
    <h1 class="h3 mb-4">Telas de <span th:text="${usuario.nome}"></span></h1>
    <form th:action="@{/permissoes/{id}/salvar(id=${usuario.id})}" method="post" class="card shadow-sm border-0 p-4">
        <div class="d-flex flex-column gap-2">
            <div class="form-check" th:each="tela : ${telas}">
                <input class="form-check-input" type="checkbox" name="telaIds" th:id="${'tela-' + tela.id}" th:value="${tela.id}"
                       th:checked="${telasSelecionadas.contains(tela.id)}">
                <label class="form-check-label" th:for="${'tela-' + tela.id}" th:text="${tela.nome}"></label>
            </div>
        </div>
        <div class="d-flex justify-content-end mt-4">
            <button class="btn btn-primary" type="submit">Salvar permissões</button>
        </div>
    </form>
</main>
</body>
</html>
