<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valore - Usuário</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-valore">
    <div class="container"><a class="navbar-brand" href="/home">Valore</a></div>
</nav>
<main class="container py-4" style="max-width:650px">
    <a class="back-link" href="/usuarios">← Usuários</a>
    <h1 class="h3 mb-4" th:text="${usuario.id == null ? 'Novo usuário' : 'Editar usuário'}"></h1>
    <form class="card shadow-sm border-0 p-4" th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input id="nome" type="text" class="form-control" th:field="*{nome}">
            <div class="form-text text-danger" th:errors="*{nome}"></div>
        </div>
        <div class="mb-3">
            <label for="login" class="form-label">Login</label>
            <input id="login" type="text" class="form-control" th:field="*{login}">
            <div class="form-text text-danger" th:errors="*{login}"></div>
        </div>
        <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <input id="senha" type="password" class="form-control" th:field="*{senha}">
            <div class="form-text text-danger" th:errors="*{senha}"></div>
        </div>
        <div class="mb-3">
            <label for="tipo" class="form-label">Tipo de usuário</label>
            <select id="tipo" class="form-select" th:field="*{tipo}">
                <option value="">Selecione</option>
                <option th:each="tipo : ${tiposUsuario}" th:value="${tipo}" th:text="${tipo}"></option>
            </select>
            <div class="form-text text-danger" th:errors="*{tipo}"></div>
        </div>
        <div class="mb-3">
            <label for="fornecedor" class="form-label">Fornecedor</label>
            <select id="fornecedor" class="form-select" th:field="*{fornecedor}">
                <option value="">Nenhum</option>
                <option th:each="fornecedor : ${fornecedores}" th:value="${fornecedor.id}" th:text="${fornecedor.razaoSocial}"></option>
            </select>
            <div class="form-text text-danger" th:errors="*{fornecedor}"></div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4">
            <a class="btn btn-outline-secondary" href="/usuarios">Cancelar</a>
            <button class="btn btn-primary" type="submit">Salvar</button>
        </div>
    </form>
</main>
</body>
</html>
