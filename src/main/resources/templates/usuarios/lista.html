<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valore - Usuários</title><link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar"><a href="/home">Valore</a><form th:action="@{/logout}" method="post"><button class="link-button" type="submit">Sair</button></form></header>
<main class="container">
    <div class="page-heading"><div><a class="back-link" href="/home">← Início</a><h1>Usuários</h1></div><a class="button primary" href="/usuarios/novo">Novo usuário</a></div>
    <div class="alert success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="table-wrapper"><table><thead><tr><th>ID</th><th>Nome</th><th>Login</th><th>Tipo</th><th>Fornecedor</th><th>Ações</th></tr></thead>
        <tbody><tr th:each="usuario : ${usuarios}"><td th:text="${usuario.id}"></td><td th:text="${usuario.nome}"></td><td th:text="${usuario.login}"></td><td th:text="${usuario.tipo}"></td><td th:text="${usuario.fornecedor != null ? usuario.fornecedor.razaoSocial : '-'}"></td><td class="actions"><a class="button small" th:href="@{/usuarios/{id}/editar(id=${usuario.id})}">Editar</a><form th:action="@{/usuarios/{id}/excluir(id=${usuario.id})}" method="post"><button class="button small danger" type="submit">Excluir</button></form></td></tr>
        <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="6" class="empty">Nenhum usuário cadastrado.</td></tr></tbody>
    </table></div>
</main>
</body>
</html>
