<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valore - Tabela de preço</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-valore">
    <div class="container">
        <a class="navbar-brand" href="/home">Valore</a>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button class="btn btn-link text-white text-decoration-none p-0" type="submit">Sair</button>
        </form>
    </div>
</nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-end mb-3">
        <div>
            <a class="back-link" href="/tabelas-preco">← Tabelas de preço</a>
            <h1 class="h3 mb-0" th:text="${tabela.nome}"></h1>
        </div>
        <div>
            <form th:if="${!tabela.ativa}" th:action="@{/tabelas-preco/{id}/ativar(id=${tabela.id})}" method="post">
                <button class="btn btn-primary" type="submit">Ativar tabela</button>
            </form>
            <form th:if="${tabela.ativa}" th:action="@{/tabelas-preco/{id}/desativar(id=${tabela.id})}" method="post">
                <button class="btn btn-outline-secondary" type="submit">Desativar tabela</button>
            </form>
        </div>
    </div>
    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
    <p>
        Situação:
        <span th:if="${tabela.ativa}" class="badge text-bg-success">Ativa</span>
        <span th:unless="${tabela.ativa}" class="badge text-bg-secondary">Inativa</span>
    </p>
    <section class="card shadow-sm border-0 p-3 mb-3">
        <h2 class="h5 text-primary">Renomear tabela</h2>
        <form th:action="@{/tabelas-preco/{id}/renomear(id=${tabela.id})}" method="post" class="d-flex gap-2">
            <input type="text" name="nome" class="form-control" th:value="${tabela.nome}" required>
            <button class="btn btn-outline-secondary text-nowrap" type="submit">Salvar nome</button>
        </form>
    </section>
    <div class="quote-layout">
        <section class="card shadow-sm border-0 p-3">
            <h2 class="h5 text-primary">Itens desta tabela</h2>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Produto</th><th>SKU</th><th>Valor</th><th>Validade</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="item : ${tabela.itens}">
                        <td th:text="${item.produto.nome}"></td>
                        <td th:text="${item.produto.sku}"></td>
                        <td th:text="${#numbers.formatDecimal(item.valor, 1, 2)}"></td>
                        <td th:text="${item.validadeValor}"></td>
                        <td><form th:action="@{/tabelas-preco/{id}/itens/{itemId}/remover(id=${tabela.id},itemId=${item.id})}" method="post"><button class="btn btn-sm btn-outline-danger" type="submit">Remover</button></form></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tabela.itens)}" class="empty-row"><td colspan="5">Nenhum item cadastrado.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
        <section class="card shadow-sm border-0 p-3">
            <h2 class="h5 text-primary">Adicionar item</h2>
            <form th:action="@{/tabelas-preco/{id}/itens(id=${tabela.id})}" method="post" class="row g-2">
                <div class="col-12">
                    <label class="form-label">Produto</label>
                    <select name="produtoId" class="form-select" required>
                        <option th:each="produto : ${produtos}" th:value="${produto.id}" th:text="${produto.nome} + ' (' + ${produto.sku} + ')'"></option>
                    </select>
                </div>
                <div class="col-12 col-sm-6">
                    <label class="form-label">Valor</label>
                    <input type="number" step="0.01" min="0.01" name="valor" class="form-control" required>
                </div>
                <div class="col-12 col-sm-6">
                    <label class="form-label">Validade do valor</label>
                    <input type="date" name="validadeValor" class="form-control" required>
                </div>
                <div class="col-12">
                    <button class="btn btn-primary mt-2" type="submit">Adicionar item</button>
                </div>
            </form>
        </section>
    </div>
</main>
</body>
</html>
