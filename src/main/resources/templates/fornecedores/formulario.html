<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valore - Fornecedor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-valore">
    <div class="container"><a class="navbar-brand" href="/home">Valore</a></div>
</nav>
<main class="container py-4" style="max-width:650px">
    <a class="back-link" href="/fornecedores">← Fornecedores</a>
    <h1 class="h3 mb-4" th:text="${fornecedor.id == null ? 'Novo fornecedor' : 'Editar fornecedor'}"></h1>
    <form class="card shadow-sm border-0 p-4" th:action="@{/fornecedores/salvar}" th:object="${fornecedor}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label for="razaoSocial" class="form-label">Razão social</label>
            <input id="razaoSocial" type="text" class="form-control" th:field="*{razaoSocial}">
            <div class="form-text text-danger" th:errors="*{razaoSocial}"></div>
        </div>
        <div class="mb-3">
            <label for="cnpj" class="form-label">CNPJ</label>
            <input id="cnpj" type="text" class="form-control" th:field="*{cnpj}">
            <div class="form-text text-danger" th:errors="*{cnpj}"></div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4">
            <a class="btn btn-outline-secondary" href="/fornecedores">Cancelar</a>
            <button class="btn btn-primary" type="submit">Salvar</button>
        </div>
    </form>
</main>
</body>
</html>
