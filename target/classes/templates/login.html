<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valore - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
<main class="login-card card shadow-sm border-0 p-4 p-md-5">
    <div class="card-body">
        <h1 class="h3 mb-1 text-primary">Valore</h1>
        <p class="text-muted mb-4">Acesse o sistema</p>
        <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
        <form th:action="@{/login}" th:object="${loginForm}" method="post">
            <div class="mb-3">
                <label for="login" class="form-label">Login</label>
                <input id="login" type="text" class="form-control" th:field="*{login}" autofocus>
                <div class="form-text text-danger" th:errors="*{login}"></div>
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input id="senha" type="password" class="form-control" th:field="*{senha}">
                <div class="form-text text-danger" th:errors="*{senha}"></div>
            </div>
            <button class="btn btn-primary w-100 mt-2" type="submit">Entrar</button>
        </form>
        <p class="hint text-muted text-center mt-4 mb-0">Ambiente inicial: admin / admin. Os demais acessos usam os usuários cadastrados.</p>
    </div>
</main>
</body>
</html>
