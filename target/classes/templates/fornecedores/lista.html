<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valore - Fornecedores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-valore">
    <div class="container">
        <a class="navbar-brand" href="/home">Valore</a>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button class="btn btn-link text-white text-decoration-none p-0" type="submit">Sair</button>
        </form>
    </div>
</nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-end mb-3">
        <div>
            <a class="back-link" href="/home">← Início</a>
            <h1 class="h3 mb-0">Fornecedores</h1>
        </div>
        <a class="btn btn-primary" href="/fornecedores/novo">Novo fornecedor</a>
    </div>
    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>ID</th><th>Razão social</th><th>CNPJ</th><th>Ações</th></tr></thead>
                <tbody>
                <tr th:each="fornecedor : ${fornecedores}">
                    <td th:text="${fornecedor.id}"></td>
                    <td th:text="${fornecedor.razaoSocial}"></td>
                    <td th:text="${fornecedor.cnpj}"></td>
                    <td class="d-flex gap-2">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/fornecedores/{id}/editar(id=${fornecedor.id})}">Editar</a>
                        <form th:action="@{/fornecedores/{id}/excluir(id=${fornecedor.id})}" method="post">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(fornecedores)}" class="empty-row"><td colspan="4">Nenhum fornecedor cadastrado.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
