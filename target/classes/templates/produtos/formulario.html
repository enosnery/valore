<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valore - Produto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-valore">
    <div class="container"><a class="navbar-brand" href="/home">Valore</a></div>
</nav>
<main class="container py-4" style="max-width:650px">
    <a class="back-link" href="/produtos">← Produtos</a>
    <h1 class="h3 mb-4" th:text="${produto.id == null ? 'Novo produto' : 'Editar produto'}"></h1>
    <form class="card shadow-sm border-0 p-4" th:action="@{/produtos/salvar}" th:object="${produto}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input id="nome" type="text" class="form-control" th:field="*{nome}">
            <div class="form-text text-danger" th:errors="*{nome}"></div>
        </div>
        <div class="mb-3">
            <label for="sku" class="form-label">SKU</label>
            <input id="sku" type="text" class="form-control" th:field="*{sku}">
            <div class="form-text text-danger" th:errors="*{sku}"></div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4">
            <a class="btn btn-outline-secondary" href="/produtos">Cancelar</a>
            <button class="btn btn-primary" type="submit">Salvar</button>
        </div>
    </form>
</main>
</body>
</html>
