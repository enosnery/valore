<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valore - Cotações</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-valore">
    <div class="container">
        <a class="navbar-brand" href="/home">Valore</a>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button class="btn btn-link text-white text-decoration-none p-0" type="submit">Sair</button>
        </form>
    </div>
</nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-end mb-3">
        <div>
            <a class="back-link" href="/home">← Início</a>
            <h1 class="h3 mb-0">Minhas cotações</h1>
        </div>
        <a class="btn btn-primary" href="/cotacoes/nova">Nova cotação</a>
    </div>
    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>Código</th><th>Criada em</th><th>Itens</th><th>Ações</th></tr></thead>
                <tbody>
                <tr th:each="cotacao : ${cotacoes}">
                    <td th:text="${cotacao.id}"></td>
                    <td th:text="${#temporals.format(cotacao.criadaEm, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${#lists.size(cotacao.itens)}"></td>
                    <td class="d-flex gap-2">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/cotacoes/{id}(id=${cotacao.id})}">Editar</a>
                        <form th:action="@{/cotacoes/{id}/excluir(id=${cotacao.id})}" method="post">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(cotacoes)}" class="empty-row"><td colspan="4">Nenhuma cotação cadastrada.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
