<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valore - Tabelas de preço</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-valore">
    <div class="container">
        <a class="navbar-brand" href="/home">Valore</a>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button class="btn btn-link text-white text-decoration-none p-0" type="submit">Sair</button>
        </form>
    </div>
</nav>
<main class="container py-4">
    <div class="mb-3">
        <a class="back-link" href="/home">← Início</a>
        <h1 class="h3 mb-0">Tabelas de preço</h1>
    </div>
    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
    <section class="card shadow-sm border-0 p-3 mb-3">
        <h2 class="h5 text-primary">Nova tabela de preço</h2>
        <form th:action="@{/tabelas-preco/nova}" method="post" class="d-flex gap-2">
            <input type="text" name="nome" class="form-control" placeholder="Nome da tabela" required>
            <button class="btn btn-primary text-nowrap" type="submit">Criar</button>
        </form>
    </section>
    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>Nome</th><th>Situação</th><th>Itens</th><th></th></tr></thead>
                <tbody>
                <tr th:each="tabela : ${tabelas}">
                    <td th:text="${tabela.nome}"></td>
                    <td>
                        <span th:if="${tabela.ativa}" class="badge text-bg-success">Ativa</span>
                        <span th:unless="${tabela.ativa}" class="badge text-bg-secondary">Inativa</span>
                    </td>
                    <td th:text="${#lists.size(tabela.itens)}"></td>
                    <td><a class="btn btn-sm btn-outline-secondary" th:href="@{/tabelas-preco/{id}(id=${tabela.id})}">Abrir</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(tabelas)}" class="empty-row"><td colspan="4">Nenhuma tabela de preço cadastrada.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
